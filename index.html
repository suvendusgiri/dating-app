<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#e8614a" />
  <meta name="description" content="Update your profile photos on the dating app." />
  <title>Update Profile Photos</title>
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body>

  <!-- ── Page header ────────────────────────────────── -->
  <header class="page-header" role="banner">
    <div class="page-header__logo" aria-hidden="true">
      <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24"
           fill="currentColor" aria-hidden="true">
        <path d="M12 21.593c-5.63-5.539-11-10.297-11-14.402
                 0-3.791 3.068-5.191 5.281-5.191
                 1.312 0 4.151.501 5.719 4.457
                 1.59-3.968 4.464-4.447 5.726-4.447
                 2.54 0 5.274 1.621 5.274 5.181
                 0 4.069-5.136 8.625-11 14.402z"/>
      </svg>
    </div>
    <span class="page-header__title">Spark</span>
  </header>

  <!-- ── Main content ───────────────────────────────── -->
  <main id="main" role="main">

    <!-- Loading state -->
    <div id="loading-state" aria-live="polite" aria-label="Loading profile">
      <div class="loading-spinner" aria-hidden="true"></div>
      <p class="loading-text">Loading your profile…</p>
    </div>

    <!-- Error state -->
    <div id="error-state" role="alert" aria-live="assertive">
      <div class="error-icon" aria-hidden="true">💔</div>
      <p>Couldn't load your profile.<br>Check your connection and try again.</p>
      <button id="retry-btn" class="retry-btn">Try again</button>
    </div>

    <!-- Loaded content -->
    <div id="content" aria-label="Profile editor">

      <!-- Profile summary card -->
      <section aria-labelledby="profile-heading">
        <h2 id="profile-heading" class="sr-only">Profile summary</h2>
        <div class="profile-card">
          <img
            id="profile-avatar"
            class="profile-card__avatar"
            src="https://picsum.photos/seed/aisha1/128/128"
            alt="Your primary photo"
            width="64" height="64"
          />
          <div class="profile-card__info">
            <p id="profile-name" class="profile-card__name" aria-label="Name">—</p>
            <p id="profile-meta" class="profile-card__meta" aria-label="Age and location">—</p>
            <p id="profile-bio"  class="profile-card__bio"  aria-label="Bio">—</p>
          </div>
        </div>
      </section>

      <!-- Photo grid section -->
      <section aria-labelledby="photos-heading">
        <h2 id="photos-heading" class="section-heading">Your photos</h2>

        <!-- Hidden file input — triggered programmatically -->
        <input
          type="file"
          id="file-input"
          class="file-input"
          accept="image/jpeg,image/png,image/webp"
          capture="environment"
          aria-label="Select a photo to upload"
        />

        <div
          id="photo-grid"
          class="photo-grid"
          role="list"
          aria-label="Profile photos — up to 6 slots"
        ></div>

        <p class="hint">
          Tap a photo to view · star to set primary · JPEG, PNG or WebP · max 5 MB each
        </p>
      </section>

      <!-- Save button -->
      <button id="save-btn" class="btn btn--primary" aria-label="Save profile changes">
        <span class="btn__label">Save changes</span>
        <span class="btn__spinner" style="display:none" aria-hidden="true"></span>
      </button>

    </div><!-- /#content -->

  </main>

  <!-- ── Toast notification ─────────────────────────── -->
  <div id="toast" role="status" aria-live="polite" aria-atomic="true"></div>

  <!-- ── Lightbox modal ─────────────────────────────── -->
  <div
    id="lightbox"
    role="dialog"
    aria-modal="true"
    aria-label="Photo viewer"
    tabindex="-1"
  >
    <div class="lightbox__container">

      <!-- Close button (top-right of image) -->
      <button id="lb-close" class="lightbox__close" aria-label="Close photo viewer">
        <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24"
             fill="none" stroke="currentColor" stroke-width="2.5"
             stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/>
        </svg>
      </button>

      <!-- Zoomable viewport -->
      <div id="lb-viewport" class="lightbox__viewport" aria-label="Photo (drag to pan, pinch to zoom)">
        <img id="lb-img" class="lightbox__img" src="" alt="Enlarged photo" draggable="false" />
      </div>

      <!-- Zoom controls -->
      <div class="lightbox__controls" role="group" aria-label="Zoom controls">
        <button id="lb-zoom-out" class="lightbox__btn" aria-label="Zoom out" title="Zoom out (−)">
          <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24"
               fill="none" stroke="currentColor" stroke-width="2.5"
               stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/>
            <line x1="8" y1="11" x2="14" y2="11"/>
          </svg>
        </button>

        <span id="lb-zoom-level" class="lightbox__zoom-level" aria-live="polite" aria-atomic="true">100%</span>

        <button id="lb-zoom-in" class="lightbox__btn" aria-label="Zoom in" title="Zoom in (+)">
          <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24"
               fill="none" stroke="currentColor" stroke-width="2.5"
               stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/>
            <line x1="11" y1="8" x2="11" y2="14"/><line x1="8" y1="11" x2="14" y2="11"/>
          </svg>
        </button>
      </div>

    </div>
  </div><!-- /#lightbox -->

  <script type="module" src="js/app.js"></script>
</body>
</html>
